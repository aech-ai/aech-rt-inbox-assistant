[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aech-rt-inbox-assistant"
version = "0.1.5"
description = "Real-time Inbox Assistant for Agent Aech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "requests",
    "pydantic",
    "pydantic-ai",
    "openai",
    "msal",
    "markdownify",
    "sentence-transformers",
    "aech-cli-documents",
    "aech-llm-observability>=0.2.0,<0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
aech-llm-observability = { path = "../aech-main/packages/aech-llm-observability", editable = true }
aech-cli-documents = { path = "../aech-cli-documents", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
