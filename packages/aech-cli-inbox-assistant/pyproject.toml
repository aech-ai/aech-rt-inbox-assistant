[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aech-cli-inbox-assistant"
version = "0.20.5"
description = "CLI for Agent Aech to query and manage Inbox Assistant state"
requires-python = ">=3.10"
dependencies = [
    "aech-rt-inbox-assistant==0.1.4",
    "click>=8.0",
]

[project.scripts]
aech-cli-inbox-assistant = "aech_cli_inbox_assistant.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aech_cli_inbox_assistant = ["manifest.json"]

[tool.uv.sources]
aech-rt-inbox-assistant = { path = "../..", editable = true }
aech-llm-observability = { path = "../../../aech-main/packages/aech-llm-observability", editable = true }
aech-cli-documents = { path = "../../../aech-cli-documents", editable = true }
